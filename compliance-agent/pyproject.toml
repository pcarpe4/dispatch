[project]
name = "compliance-automation"
version = "0.1.0"
description = "Weekly compliance automation agent + RAG chatbot"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "pymongo>=4.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "pypdf>=4.2.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0", "pytest>=8.2.0"]

[project.scripts]
compliance-agent = "agent.__main__:main"
compliance-indexer = "indexer.__main__:main"
compliance-chatbot = "chatbot.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "indexer*", "chatbot*"]

[tool.ruff]
line-length = 100
target-version = "py311"
